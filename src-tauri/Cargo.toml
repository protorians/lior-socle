[package]
name = "sentient-manager"
version = "0.13.0"
description = "Sentients Socle desktop/mobile application"
authors = ["Sentient"]
edition = "2021"

[lib]
name = "sentient_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
