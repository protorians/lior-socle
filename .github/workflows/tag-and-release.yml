name: Create Tag & Release

on:
  push:
    branches:
      - alpha
      - beta
      - rc
      - main

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute next tag
        id: version
        run: |
          branch="${{ github.ref_name }}"
          base_version="v$(node -p "require('./package.json').version")"
          case "$branch" in
            alpha|beta|rc)
              last=$(git tag -l "${base_version}-${branch}.*" | sort -V | tail -n 1)
              if [ -z "$last" ]; then
                next="${base_version}-${branch}.1"
              else
                number="${last##*.}"
                next="${base_version}-${branch}.$((number + 1))"
              fi
              ;;
            main)
              next="$base_version"
              ;;
          esac
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "Computed tag: $next"

      - name: Skip if tag already created
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1 || git rev-parse -q --verify "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists on this branch, skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and release
        if: steps.check.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          branch="${{ github.ref_name }}"
          if [ "$branch" = "main" ]; then
            gh release create "$tag" --target "${{ github.sha }}" --generate-notes
          else
            gh release create "$tag" --target "${{ github.sha }}" --generate-notes --prerelease
          fi